<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <section>
            <h1>Willkommen bei Wohnheim Portal</h1>
        </section>
    </header>
    <main class="page">
        <section class="card">
            <h2>Login</h2>

            <p>Bitte melden Sie sich mit Ihrem Konto an.</p>

            <br>   
            <label for="email">E-Mail-Adresse:</label>
            <input type="email" id="email" placeholder="name@example.com">
            <br>
            <label for="password">Passwort:</label>
            <input type="password" id="password" placeholder="Passwort eingeben">
            <br>
            <a class="button" href="dashboard.html">login</a>
            

            <p>
                Haben Sie noch kein Konto?<br><br>
                <a class="button secondary" href="registrieren.html">registrieren</a>
            </p>
        </section>
    </main>
</body>
</html>
